spring.application.name=demo
server.port=8081
# application.properties
# Enable the H2 console for easy access (optional, but recommended for dev)
spring.h2.console.enabled=true
# Customize the H2 console URL path (optional)
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Keep the database open as long as the JVM is running, even after the last connection closes (optional, for convenience)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate DDL Auto property (this is what creates the schema)
spring.jpa.hibernate.ddl-auto=update

# Optional: specify the dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional: allow data.sql and schema.sql scripts to run after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true

# ===================================================================
# 1. CORE LOGGING REGISTRATION
# ===================================================================
# Set the default global logging level for your entire application
logging.level.root=INFO

# Enable detailed tracking specifically for your subscriber code package
logging.level.com.example.demo=DEBUG

# Optional: View the raw SQL queries executed by your repository
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# 2. FILE OUTPUT CONFIGURATION
# ===================================================================
# Define the path and filename where your system logs will be written
logging.file.name=logs/subscriber-system.log

# ===================================================================
# 3. LOG ROTATION & CLEANUP POLICIES (Spring Boot Default Engine)
# ===================================================================
# Automatically split the log file when it hits 10 Megabytes
logging.logback.rollingpolicy.max-file-size=10MB

# Keep a maximum history of 30 days of archived logs before auto-deleting
logging.logback.rollingpolicy.max-history=30

# Cap total size of all archived logs on disk to 1 Gigabyte
logging.logback.rollingpolicy.total-size-cap=1GB

# Pattern used to name archived/rolled files (%d is date, %i is index)
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz

# ===================================================================
# 4. CUSTOM FORMAT PATTERNS (Optional Visual Customization)
# ===================================================================
# Console Display: Date, Thread, Level (with colors), Logger name, and Message
logging.pattern.console=%clr(%d{yyyy-MM-? HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# File Storage: Standard plain text formatting without ANSI colors
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : %m%n
